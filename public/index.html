<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Port de Plaisance Russell – Connexion</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h1>Port de Plaisance de Russell</h1>
    <p class="subtitle">
      Application interne de gestion des catways et des réservations.
    </p>

    <h2>Connexion</h2>

    <form onsubmit="login(event)">
      <label>Email :</label>
      <input type="email" id="email" required>

      <label>Mot de passe :</label>
      <input type="password" id="password" required>

      <button type="submit">Se connecter</button>
    </form>

    <p class="doc-link">
      <a href="/documentation.html">📄 Consulter la documentation de l’API</a>
    </p>
  </div>

  <script>
    async function login(e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (data.token) {
        localStorage.setItem("token", data.token);
        window.location.href = "/dashboard.html";
      } else {
        alert("Identifiants incorrects");
      }
    }
  </script>

</body>
</html>
